<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像一致判定システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="status">OpenCV.jsを読み込み中...</div>
  
  <!-- スコア表示領域 -->
  <div id="score-board">正解数: 0 / 0</div>
  
  <video id="videoInput" width="640" height="480" autoplay playsinline style="display:none;"></video>
  <canvas id="canvasOutput" width="640" height="480"></canvas>

  <!-- 成功時に一時表示するテキスト（ボタンは削除） -->
  <div id="success-ui"></div>

  <script src="main.js"></script>
  <script async src="opencv.js" onload="onOpenCvReady();"></script>
</body>
</html>
