<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像一致判定システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="status">OpenCV.jsを読み込み中...</div>
  
  <div id="score-board">正解数: 0 / 0</div>
  
  <!-- カメラ映像を表示するコンテナ -->
  <div id="canvas-container">
    <video id="videoInput" playsinline style="display:none;"></video>
    <canvas id="canvasOutput"></canvas>
    
    <!-- 成功/失敗時に表示するテキスト -->
    <div id="success-ui"></div>
  </div>

  <!-- 決定ボタン（初期状態は無効化） -->
  <button id="capture-btn" disabled>判定する</button>

  <script src="main.js"></script>
  <script async src="opencv.js" onload="onOpenCvReady();"></script>
</body>
</html>
