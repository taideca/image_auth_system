<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像一致判定システム</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #333; color: white; font-family: sans-serif; }
    #canvasOutput { max-width: 100%; height: auto; border: 2px solid #555; }
    #status { padding: 10px; font-size: 18px; font-weight: bold; }
    /* 判定成功時のUI */
    #success-ui { display: none; margin-top: 20px; padding: 20px; background: #4CAF50; border-radius: 8px; text-align: center;}
    #success-ui button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="status">OpenCV.jsを読み込み中...</div>
  
  <!-- カメラ映像（処理用なので非表示） -->
  <video id="videoInput" width="640" height="480" autoplay playsinline style="display:none;"></video>
  
  <!-- 処理結果・ガイド表示用キャンバス -->
  <canvas id="canvasOutput" width="640" height="480"></canvas>

  <!-- 照合するテンプレート画像（非表示） -->
  <img id="templateImage" src="template.png" style="display:none;">

  <!-- 成功時に表示するUI -->
  <div id="success-ui">
    <p>判定成功！イラストが一致しました。</p>
    <button onclick="window.location.href='https://github.com/'">次のページへ遷移</button>
  </div>

  <!-- OpenCV.jsの非同期読み込み -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <!-- メインロジック -->
  <script src="main.js"></script>
</body>
</html>
