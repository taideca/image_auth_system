<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム画像照合システム</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video, canvas { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
        #status { font-weight: bold; font-size: 1.2rem; margin: 15px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
    
    <!-- エラーを画面に強制表示するスクリプト -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerText = "エラー発生: " + message + " (Line: " + lineno + ")";
                statusDiv.className = "fail";
            }
            return false;
        };
    </script>

    <!-- OpenCV.js の読み込み（読み込みエラー時も画面に表示） -->
    <script async src="https://github.io" id="opencv-js" 
        onload="onOpenCvReady();" 
        onerror="document.getElementById('status').innerText='OpenCV.jsのダウンロードに失敗しました（github.io）'; document.getElementById('status').className='fail';"></script>
</head>
<body>

<div class="container">
    <h2>📷 リアルタイム画像照合</h2>
    <div id="status" class="loading">システム起動中...</div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="outputCanvas"></canvas>
</div>

<script src="main.js"></script>
</body>
</html>
