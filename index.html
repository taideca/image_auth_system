<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム画像照合システム</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video, canvas { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
        #status { font-weight: bold; font-size: 1.2rem; margin: 15px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
    <!-- OpenCV.js の読み込み -->
    <script async src="https://opencv.org" id="opencv-js" onload="onOpenCvReady();"></script>
</head>
<body>

<div class="container">
    <h2>📷 リアルタイム画像照合</h2>
    <div id="status" class="loading">システム起動中...</div>

    <!-- カメラ映像と判定表示用のキャンバス -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="outputCanvas"></canvas>
</div>

<!-- 外部JavaScriptファイルの読み込み -->
<script src="main.js"></script>
</body>
</html>
