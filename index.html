<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム画像照合システム (Fast版)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video, canvas { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
        #status { font-weight: bold; font-size: 1.2rem; margin: 15px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
    <!-- JavaScriptエラーを画面に強制表示するデバッグスクリプト -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerText = "🚨 実行エラー: " + message + " (行: " + lineno + ")";
                statusDiv.className = "fail";
            }
            return false;
        };
    </script>
    <!-- 安定した大手サーバーからライブラリをロード -->
    <script src="https://cloudflare.com"
            onerror="document.getElementById('status').innerText='❌ tracking.jsのダウンロードに失敗しました'; document.getElementById('status').className='fail';"></script>
</head>
<body>

<div class="container">
    <h2>📷 リアルタイム画像照合 (Fast版)</h2>
    <div id="status" class="loading">正解画像を読み込み中...</div>

    <!-- 内部処理・表示用の要素 -->
    <video id="video" width="320" height="240" preload autoplay loop muted playsinline></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
</div>

<script src="main.js"></script>
</body>
</html>
